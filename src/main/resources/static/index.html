<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGasto - Control de Gastos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header>
    <h1>GeoGasto</h1>
    <p>Sistema Inteligente de Control de Gastos</p>
</header>

<nav>
    <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#registrar">Registrar</a></li>
        <li><a href="#lista">Mis Gastos</a></li>
    </ul>
</nav>

<main>
    <section id="inicio">
        <h2>Bienvenido</h2>
        <p>Registra y visualiza tus gastos de manera inteligente.</p>
    </section>

    <section id="registrar">
        <h2>Registrar Nuevo Gasto</h2>
        <form id="form-gasto">
            <div class="campo">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" required maxlength="255"
                       placeholder="Ej. Almuerzo en el centro">
            </div>

            <div class="campo">
                <label for="monto">Monto (S/):</label>
                <input type="number" id="monto" required min="0.01" step="0.01"
                       placeholder="0.00">
            </div>

            <div class="campo">
                <label for="categoria">Categoría:</label>
                <select id="categoria" required>
                    <option value="">-- Selecciona --</option>
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Salud">Salud</option>
                </select>
            </div>

            <button type="submit" class="btn-primario">Guardar Gasto</button>
        </form>
    </section>

    <section id="lista">
        <h2>Mis Gastos</h2>
        <ul id="lista-gastos">
            <li class="vacio">No hay gastos registrados.</li>
        </ul>
    </section>
</main>

<footer>
    <p>&copy; 2026 GeoGasto - Proyecto Académico</p>
</footer>

<script src="/js/app.js"></script>
</body>
</html>
